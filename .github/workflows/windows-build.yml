name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Build standalone executable
        run: cmd /c build-windows.cmd
        env:
          CI: "true"

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: SteamLogScrubber-Windows
          path: dist/SteamLogScrubber.exe
          if-no-files-found: error
