[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steamlogscrubber"
version = "0.3.0"
description = "Steam and Proton log scrubber for safe support sharing."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Blake Blair", email = "contact@blakeblair.dev" }
]
keywords = ["steam", "proton", "logs", "privacy", "scrubber", "linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Logging",
  "Topic :: Utilities"
]

[project.optional-dependencies]
windows-build = ["pyinstaller>=6.0"]

[project.scripts]
steamlogscrub = "steamlogscrubber.cli:main"
steamlogscrub-gui = "steamlogscrubber.gui:main"

[project.urls]
Homepage = "https://github.com/blakeblair/steamlogscrubber"
Repository = "https://github.com/blakeblair/steamlogscrubber"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steamlogscrubber = ["rules/*.steamlogscrub.json", "assets/*.gif"]
